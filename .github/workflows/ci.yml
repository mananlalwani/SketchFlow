name: CI

on:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @sketchflow/server db:generate

      - name: Build workspace
        run: pnpm build

      - name: Run all tests
        run: pnpm test

      - name: Lint client
        run: pnpm lint

      - name: Type check workspace
        run: pnpm type-check

      - name: Audit production dependencies
        run: pnpm audit:prod

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: sketchflow:ci

      - name: Container smoke test
        run: |
          docker run -d --rm --name sketchflow-ci -p 3000:3000 \
            -e DATABASE_URL=postgresql://sketchflow:sketchflow@127.0.0.1:5432/sketchflow \
            -e CLERK_SECRET_KEY=sk_live_ci_only \
            -e CLERK_PUBLISHABLE_KEY=pk_test_ci_only \
            -e CORS_ORIGINS=http://localhost:3000 \
            sketchflow:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/api/health >/dev/null
          curl --fail --silent http://localhost:3000/draw >/dev/null
          docker stop sketchflow-ci

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

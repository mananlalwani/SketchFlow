# Disposable services for the real persistence and multi-instance Socket.IO suites.
# Start through `pnpm test:infrastructure`; do not use this file for development.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sketchflow
      POSTGRES_PASSWORD: sketchflow_test
      POSTGRES_DB: sketchflow_test
    ports:
      - '127.0.0.1::5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sketchflow -d sketchflow_test']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1::6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

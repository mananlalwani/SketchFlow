name: CI

on:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DATABASE_URL: postgresql://sketchflow:sketchflow@localhost:5432/sketchflow
  CLERK_SECRET_KEY: sk_test_ci_only
  CLERK_PUBLISHABLE_KEY: pk_test_ci_only
  CORS_ORIGINS: http://localhost:5173,http://localhost:3000

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sketchflow
          POSTGRES_PASSWORD: sketchflow
          POSTGRES_DB: sketchflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sketchflow -d sketchflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @sketchflow/server db:generate

      - name: Validate migrations on clean database
        run: pnpm --filter @sketchflow/server db:migrate:deploy

      - name: Build workspace
        run: pnpm build

      - name: Lint workspace
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check workspace
        run: pnpm type-check

      - name: Run unit and integration tests
        run: pnpm test

      - name: Run Playwright E2E tests
        run: pnpm test:e2e

      - name: Audit production dependencies
        run: pnpm audit:prod

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    needs: release-gate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sketchflow
          POSTGRES_PASSWORD: sketchflow
          POSTGRES_DB: sketchflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sketchflow -d sketchflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: sketchflow:ci

      - name: Container readiness smoke test
        run: |
          docker run -d --rm --name sketchflow-ci -p 3000:3000 \
            -e DATABASE_URL=postgresql://sketchflow:sketchflow@host.docker.internal:5432/sketchflow \
            -e CLERK_SECRET_KEY=sk_test_ci_only \
            -e CLERK_PUBLISHABLE_KEY=pk_test_ci_only \
            -e CORS_ORIGINS=http://localhost:3000 \
            --add-host=host.docker.internal:host-gateway \
            sketchflow:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/api/readyz >/dev/null
          curl --fail --silent http://localhost:3000/draw >/dev/null
          docker stop sketchflow-ci

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: release-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

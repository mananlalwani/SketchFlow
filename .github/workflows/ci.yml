name: CI

on:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sketchflow
          POSTGRES_PASSWORD: sketchflow
          POSTGRES_DB: sketchflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sketchflow -d sketchflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sketchflow:sketchflow@localhost:5432/sketchflow_test?schema=public
      CLERK_SECRET_KEY: sk_test_ci_only
      CLERK_PUBLISHABLE_KEY: pk_test_ci_only
      CORS_ORIGINS: http://127.0.0.1:4173

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @sketchflow/server db:generate

      - name: Apply migrations to clean database
        run: pnpm --filter @sketchflow/server db:migrate:deploy

      - name: Build workspace
        run: pnpm build

      - name: Run all tests
        run: pnpm test

      - name: Generate coverage reports
        run: pnpm test:coverage

      - name: Publish coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/client/coverage
            apps/server/coverage

      - name: Install Playwright browser
        run: pnpm --filter @sketchflow/client exec playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: pnpm --filter @sketchflow/client test:e2e

      - name: Publish browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/client/playwright-report
            apps/client/test-results
          if-no-files-found: ignore

      - name: Lint workspace
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check workspace
        run: pnpm type-check

      - name: Audit production dependencies
        run: pnpm audit:prod

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sketchflow
          POSTGRES_PASSWORD: sketchflow
          POSTGRES_DB: sketchflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sketchflow -d sketchflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install migration tooling
        run: pnpm install --frozen-lockfile
      - name: Apply migrations to container smoke database
        env:
          DATABASE_URL: postgresql://sketchflow:sketchflow@localhost:5432/sketchflow_test?schema=public
        run: pnpm --filter @sketchflow/server db:migrate:deploy
      - name: Seed shared-project lifecycle fixture
        env:
          PGPASSWORD: sketchflow
        run: |
          psql --host=127.0.0.1 --username=sketchflow --dbname=sketchflow_test <<'SQL'
          INSERT INTO projects (id, "userId", title, data, shared, "shareToken", "shareExpiresAt")
          VALUES (
            'cicollaborationproject000001',
            'user_ci',
            'CI shared project',
            '{"objects": []}'::jsonb,
            TRUE,
            'ci_shared_project_token_123456789',
            NOW() + INTERVAL '1 day'
          );
          SQL
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: sketchflow:ci

      - name: Container smoke test
        run: |
          docker run -d --rm --name sketchflow-ci \
            --network host \
            -e DATABASE_URL=postgresql://sketchflow:sketchflow@127.0.0.1:5432/sketchflow_test \
            -e CLERK_SECRET_KEY=sk_live_ci_only \
            -e CLERK_PUBLISHABLE_KEY=pk_test_ci_only \
            -e CORS_ORIGINS=http://localhost:3000 \
            sketchflow:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/api/readyz >/dev/null
          curl --fail --silent http://localhost:3000/draw >/dev/null
          curl --fail --silent http://localhost:3000/api/projects/shared/ci_shared_project_token_123456789 | \
            jq -e '.title == "CI shared project" and .shared == true' >/dev/null
          docker stop sketchflow-ci

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

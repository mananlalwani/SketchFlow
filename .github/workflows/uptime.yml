name: Uptime monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check VPS backend
    runs-on: ubuntu-latest
    steps:
      - name: Check VPS backend
        id: health
        env:
          UPTIME_ORIGIN_URL: ${{ secrets.UPTIME_ORIGIN_URL }}
        shell: bash
        run: |
          set -uo pipefail
          if [[ -z "$UPTIME_ORIGIN_URL" ]]; then
            echo 'UPTIME_ORIGIN_URL is not configured; skipping origin check.'
            exit 0
          fi
          failed=0
          for target in \
            "backend|${UPTIME_ORIGIN_URL%/}/api/health"; do
            name="${target%%|*}"
            url="${target#*|}"
            status="$(curl --silent --show-error --location --max-time 20 \
              --retry 2 --retry-delay 2 \
              -A 'Mozilla/5.0 (compatible; SketchFlow-Uptime/1.0)' \
              --output /dev/null --write-out '%{http_code}' "$url" || true)"
            echo "$name HTTP $status"
            if [[ "$status" != 2* ]]; then
              failed=1
              echo "failed=$name" >> "$GITHUB_OUTPUT"
            fi
          done
          exit "$failed"

      - name: Notify Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FAILED_SERVICE: ${{ steps.health.outputs.failed || 'unknown' }}
        shell: bash
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo 'DISCORD_WEBHOOK_URL is not configured; skipping notification.'
            exit 0
          fi
          payload=$(jq -n \
            --arg service "$FAILED_SERVICE" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{content:("🚨 SketchFlow uptime check failed for " + $service + ". " + $repo + " — " + $run)}')
          curl --fail --silent --show-error --max-time 20 \
            -H 'Content-Type: application/json' \
            --data "$payload" "$DISCORD_WEBHOOK_URL"

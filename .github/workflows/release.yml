name: Production release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sketchflow

jobs:
  release:
    name: Validate, publish, deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Validate release source
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/sketchflow_build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @sketchflow/server db:generate
          pnpm build
          pnpm test
          pnpm check:release-hygiene
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Trigger protected deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          test -n "$DEPLOY_WEBHOOK_URL"
          test -n "$DEPLOY_WEBHOOK_TOKEN"
          curl --fail --show-error --silent --retry 3 \
            --request POST \
            --header "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"version\":\"$GITHUB_REF_NAME\",\"sha\":\"$GITHUB_SHA\"}" \
            "$DEPLOY_WEBHOOK_URL"
      - name: Public smoke test
        env:
          PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          test -n "$PRODUCTION_APP_URL"
          test -n "$PRODUCTION_API_URL"
          for attempt in $(seq 1 30); do
            curl --fail --silent "$PRODUCTION_API_URL/api/health" >/dev/null && break
            sleep 5
          done
          curl --fail --silent "$PRODUCTION_API_URL/api/health" >/dev/null
          curl --fail --silent "$PRODUCTION_APP_URL/draw" >/dev/null

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Do not spend runner time validating commits that have already been replaced
# by a newer push to the same pull request or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sketchflow

jobs:
  changes:
    name: Detect deploy scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      container: ${{ steps.filter.outputs.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            container:
              - 'apps/server/**'
              - 'packages/shared/**'
              - 'Dockerfile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'

  test:
    name: Test & Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install & Build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/sketchflow_build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @sketchflow/server db:generate
          pnpm build
      - name: Test, Lint, Type Check, Audit
        run: |
          # The build above already type-checks the shared and server packages.
          # Run independent checks concurrently; client/server tests used to be
          # serialized by the root `pnpm test` script.
          pids=()
          pnpm --filter @sketchflow/client test & pids+=("$!")
          pnpm --filter @sketchflow/server test & pids+=("$!")
          pnpm lint &
          pids+=("$!")
          pnpm --filter @sketchflow/client type-check & pids+=("$!")
          pnpm audit:prod & pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.container == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: sketchflow:ci
          # The production image is the most expensive PR check. Persist all
          # BuildKit layers between workflow runs, including pnpm install and
          # client/server compilation layers.
          cache-from: type=gha,scope=sketchflow-production-image
          cache-to: type=gha,mode=max,scope=sketchflow-production-image
          build-args: |
            BUILDPLATFORM=linux/amd64
            TARGETPLATFORM=linux/amd64
      - name: Container smoke test
        run: |
          docker run -d --rm --name sketchflow-ci -p 3000:3000 \
            -e DATABASE_URL=postgresql://sketchflow:sketchflow@127.0.0.1:5432/sketchflow \
            -e CLERK_SECRET_KEY=sk_live_ci_only \
            -e CLERK_PUBLISHABLE_KEY=pk_test_ci_only \
            -e CORS_ORIGINS=http://localhost:3000 \
            -e RELEASE_ID=ci-smoke \
            -e SENTRY_DSN=https://public@example.ingest.sentry.io/0 \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 \
            sketchflow:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/api/health >/dev/null
          curl --fail --silent http://localhost:3000/draw >/dev/null
          docker stop sketchflow-ci

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [changes, test, container-build]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' && needs.container-build.result == 'success' &&
      needs.changes.outputs.container == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
            type=gha,scope=sketchflow-production-image
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

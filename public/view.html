<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viewer (PC)</title>
    <style>
      :root {
        --glass-bg: rgba(16,16,28,0.55);
        --glass-border: rgba(255,255,255,0.12);
        --btn-bg: rgba(255,255,255,0.08);
        --btn-bg-hover: rgba(255,255,255,0.14);
        --btn-border: rgba(255,255,255,0.15);
      }
      html, body { margin: 0; height: 100%; background: #0f0f23; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #wrap { position: relative; width: 100vw; height: 100vh; }
      #canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #topbar {
        position: absolute; top: 12px; left: 12px; right: 12px; display: flex; align-items: center; gap: 10px; z-index: 10;
        padding: 10px 12px; border-radius: 14px; background: var(--glass-bg); border: 1px solid var(--glass-border);
        -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
        box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      }
      #status { padding: 6px 10px; border-radius: 999px; font-size: 12px; border: 1px solid transparent; }
      #status.connected { background: rgba(34,197,94,0.18); color: #22c55e; border-color: rgba(34,197,94,0.35); }
      #status.disconnected { background: rgba(239,68,68,0.18); color: #ef4444; border-color: rgba(239,68,68,0.35); }
      #title { margin-left: auto; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.35); font-weight: 600; }
      #controls { display: flex; gap: 8px; }
      .btn {
        background: var(--btn-bg); color: #fff; border: 1px solid var(--btn-border); padding: 8px 12px; border-radius: 10px; cursor: pointer;
        transition: transform .08s ease, background .15s ease, border-color .15s ease; user-select: none;
      }
      .btn:hover { background: var(--btn-bg-hover); }
      .btn:active { transform: translateY(1px) scale(0.98); }
      .btn:focus-visible { outline: 2px solid rgba(59,130,246,0.6); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="topbar">
        <div id="status" class="connecting">Connecting…</div>
        <div id="controls">
          <button id="goToContent" class="btn" title="Center on content">⤢ Go to Content</button>
          <button id="zoomOut" class="btn" title="Zoom out">−</button>
          <button id="zoomIn" class="btn" title="Zoom in">＋</button>
          <button id="resetZoom" class="btn" title="Reset zoom">100%</button>
        </div>
        <div id="title">🎨 Live Drawing Viewer</div>
      </div>
      <canvas id="canvas"></canvas>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      ctx.imageSmoothingEnabled = false;
      const DPR = Math.max(1, window.devicePixelRatio || 1);
      let zoom = 1;
      const MIN_ZOOM = 0.25;
      const MAX_ZOOM = 4;
      const WORLD_W_DEFAULT = 4096;
      const WORLD_H_DEFAULT = 4096;
      const worldCanvas = document.createElement('canvas');
      worldCanvas.width = Math.floor(WORLD_W_DEFAULT * (window.devicePixelRatio || 1));
      worldCanvas.height = Math.floor(WORLD_H_DEFAULT * (window.devicePixelRatio || 1));
      const wctx = worldCanvas.getContext('2d');
      wctx.imageSmoothingEnabled = false;
      const VIEW_DPR = Math.max(1, window.devicePixelRatio || 1);
      wctx.setTransform(1, 0, 0, 1, 0, 0);
      wctx.scale(VIEW_DPR, VIEW_DPR);
      wctx.fillStyle = '#111';
      wctx.fillRect(0, 0, worldCanvas.width, worldCanvas.height);
      let viewX = 0, viewY = 0;
      const statusEl = document.getElementById('status');
      const goToContentBtn = document.getElementById('goToContent');
      // Vector overlay for high-quality zoomed strokes
      const overlayStrokes = [];
      let overlayCurrent = null;
      let overlayLastAt = 0;

      function clampView() {
        const vw = canvas.clientWidth;
        const vh = canvas.clientHeight;
        const srcW = Math.max(1, Math.round(vw / zoom));
        const srcH = Math.max(1, Math.round(vh / zoom));
        const maxX = Math.max(0, worldCanvas.width - srcW);
        const maxY = Math.max(0, worldCanvas.height - srcH);
        viewX = Math.max(0, Math.min(viewX, maxX));
        viewY = Math.max(0, Math.min(viewY, maxY));
      }

      function resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = Math.floor(w * DPR);
        canvas.height = Math.floor(h * DPR);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        render();
      }
      resize();
      window.addEventListener('resize', resize);

      let renderScheduled = false;
      function render() {
        clampView();
        // Reset transform and apply DPR scale
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(DPR, DPR);
        const vw = canvas.clientWidth;
        const vh = canvas.clientHeight;
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, vw, vh);
        const srcW = Math.max(1, Math.round(vw / zoom));
        const srcH = Math.max(1, Math.round(vh / zoom));
        const sx = viewX | 0;
        const sy = viewY | 0;
        // Smooth when zoomed to blend pixels
        ctx.imageSmoothingEnabled = zoom !== 1;
        if (ctx.imageSmoothingEnabled && ctx.imageSmoothingQuality) ctx.imageSmoothingQuality = 'high';
        // Vector overlay at zoom for smooth strokes (draw overlay first) with path batching
        if (overlayStrokes.length) {
          ctx.save();
          ctx.scale(zoom, zoom);
          ctx.translate(-viewX, -viewY);
          let lastStyle = null;
          const flush = () => {
            if (!lastStyle) return;
            ctx.stroke();
            lastStyle = null;
          };
          for (const s of overlayStrokes) {
            if (!s.points || s.points.length < 2) continue;
            const style = `${s.color}|${s.size}|${s.alpha ?? 1}|${s.blend || 'source-over'}`;
            if (style !== lastStyle) {
              flush();
              ctx.beginPath();
              ctx.strokeStyle = s.color;
              ctx.lineWidth = s.size;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.globalAlpha = s.alpha ?? 1;
              ctx.globalCompositeOperation = s.blend || 'source-over';
              lastStyle = style;
              ctx.moveTo(s.points[0].x, s.points[0].y);
            } else {
              ctx.moveTo(s.points[0].x, s.points[0].y);
            }
            for (let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
          }
          flush();
          ctx.restore();
        }
        // Draw base under overlay to avoid double-blending
        const dprSrcW = Math.max(1, Math.round(srcW * VIEW_DPR));
        const dprSrcH = Math.max(1, Math.round(srcH * VIEW_DPR));
        const dprSx = Math.max(0, Math.round(sx * VIEW_DPR));
        const dprSy = Math.max(0, Math.round(sy * VIEW_DPR));
        const prevC2 = ctx.globalCompositeOperation;
        ctx.globalCompositeOperation = 'destination-over';
        ctx.drawImage(worldCanvas, dprSx, dprSy, dprSrcW, dprSrcH, 0, 0, vw, vh);
        ctx.globalCompositeOperation = prevC2;
      }
      function requestRender() {
        if (renderScheduled) return;
        renderScheduled = true;
        requestAnimationFrame(() => { renderScheduled = false; render(); });
      }
      render();

      const socket = io();
      socket.on('connect', () => { statusEl.textContent = 'Connected'; statusEl.classList.remove('disconnected'); });
      socket.on('disconnect', () => { statusEl.textContent = 'Disconnected'; statusEl.classList.add('disconnected'); });
      socket.on('connect', () => { statusEl.textContent = 'Connected'; statusEl.classList.remove('disconnected'); });
      socket.on('disconnect', () => { statusEl.textContent = 'Disconnected'; statusEl.classList.add('disconnected'); });

      function drawStroke(seg) {
        // Store vector overlay only (avoid double-blend issues on zoom)
        const alpha = typeof seg.alpha === 'number' ? seg.alpha : 1;
        const blend = seg.blend || 'source-over';
        // Group into overlay strokes
        const sameAs = overlayCurrent && overlayCurrent.color === seg.color && overlayCurrent.size === seg.size && overlayCurrent.blend === blend && overlayCurrent.alpha === alpha && overlayCurrent.lastX === seg.x0 && overlayCurrent.lastY === seg.y0;
        if (!sameAs) {
          overlayCurrent = { color: seg.color, size: seg.size, alpha, blend, points: [{ x: seg.x0, y: seg.y0 }, { x: seg.x1, y: seg.y1 }], lastX: seg.x1, lastY: seg.y1 };
          overlayStrokes.push(overlayCurrent);
        } else {
          overlayCurrent.points.push({ x: seg.x1, y: seg.y1 });
          overlayCurrent.lastX = seg.x1; overlayCurrent.lastY = seg.y1;
        }
        requestRender();
      }

      socket.on('draw:stroke', drawStroke);
      socket.on('draw:strokes', (strokes) => {
        if (!Array.isArray(strokes)) return;
        for (const s of strokes) drawStroke(s);
      });

      socket.on('canvas:snapshot', (payload) => {
        let dataUrl = payload;
        let worldW = WORLD_W_DEFAULT;
        let worldH = WORLD_H_DEFAULT;
        if (payload && typeof payload === 'object') {
          dataUrl = payload.dataUrl;
          worldW = payload.worldW || WORLD_W_DEFAULT;
          worldH = payload.worldH || WORLD_H_DEFAULT;
        }
        const img = new Image();
        img.onload = () => {
          if (worldCanvas.width !== worldW || worldCanvas.height !== worldH) {
            worldCanvas.width = worldW; worldCanvas.height = worldH;
          }
          wctx.fillStyle = '#111';
          wctx.fillRect(0, 0, worldCanvas.width, worldCanvas.height);
          wctx.drawImage(img, 0, 0, worldCanvas.width, worldCanvas.height);
          requestRender();
        };
        img.src = dataUrl;
      });

      // Panning via mouse (space or middle mouse) and touch (two-finger)
      let isPanning = false;
      let panStartX = 0, panStartY = 0, panViewStartX = 0, panViewStartY = 0;
      let spaceDown = false;

      canvas.addEventListener('mousedown', (e) => {
        if (spaceDown || e.button === 1 || e.button === 0) {
          isPanning = true;
          panStartX = e.clientX; panStartY = e.clientY;
          panViewStartX = viewX; panViewStartY = viewY;
        }
      });
      canvas.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        const dx = e.clientX - panStartX;
        const dy = e.clientY - panStartY;
        viewX = panViewStartX - dx / zoom;
        viewY = panViewStartY - dy / zoom;
        requestRender();
      });
      window.addEventListener('mouseup', () => { isPanning = false; });
      window.addEventListener('keydown', (e) => { if (e.code === 'Space') { spaceDown = true; e.preventDefault(); }});
      window.addEventListener('keyup', (e) => { if (e.code === 'Space') { spaceDown = false; }});

      function posFromTouch(touch) {
        const rect = canvas.getBoundingClientRect();
        return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
      }
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length >= 2) {
          isPanning = true;
          panStartX = e.touches[0].clientX; panStartY = e.touches[0].clientY;
          panViewStartX = viewX; panViewStartY = viewY;
        }
      }, { passive: false });
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!isPanning) return;
        const cx = e.touches[0].clientX, cy = e.touches[0].clientY;
        const dx = cx - panStartX; const dy = cy - panStartY;
        viewX = panViewStartX - dx / zoom;
        viewY = panViewStartY - dy / zoom;
        requestRender();
      }, { passive: false });

      function zoomAt(factor, cx, cy) {
        const vw = canvas.clientWidth;
        const vh = canvas.clientHeight;
        const prevZoom = zoom;
        const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
        if (newZoom === prevZoom) return;
        // world coords under cursor before zoom
        const wx = viewX + (cx / prevZoom);
        const wy = viewY + (cy / prevZoom);
        zoom = newZoom;
        // keep cursor anchored
        viewX = wx - (cx / zoom);
        viewY = wy - (cy / zoom);
        clampView();
        requestRender();
      }

      // Wheel to zoom (Ctrl not required)
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
        // Use offsetX/Y in CSS pixels
        const rect = canvas.getBoundingClientRect();
        const cx = e.clientX - rect.left;
        const cy = e.clientY - rect.top;
        zoomAt(factor, cx, cy);
      }, { passive: false });

      // Buttons
      const zoomInBtn = document.getElementById('zoomIn');
      const zoomOutBtn = document.getElementById('zoomOut');
      const resetZoomBtn = document.getElementById('resetZoom');
      zoomInBtn.addEventListener('click', () => {
        zoomAt(1.2, canvas.clientWidth / 2, canvas.clientHeight / 2);
      });
      zoomOutBtn.addEventListener('click', () => {
        zoomAt(1 / 1.2, canvas.clientWidth / 2, canvas.clientHeight / 2);
      });
      resetZoomBtn.addEventListener('click', () => {
        zoom = 1; clampView(); requestRender();
      });
      canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (isPanning && e.touches.length < 2) { isPanning = false; }
      }, { passive: false });

      // Go to content: center the view on non-background pixels
      goToContentBtn.addEventListener('click', () => {
        try {
          const img = wctx.getImageData(0, 0, worldCanvas.width, worldCanvas.height);
          const data = img.data;
          const bg = { r: 17, g: 17, b: 17 };
          const threshold = 6;
          let minX = worldCanvas.width, minY = worldCanvas.height, maxX = -1, maxY = -1;
          for (let y = 0; y < worldCanvas.height; y++) {
            const row = y * worldCanvas.width * 4;
            for (let x = 0; x < worldCanvas.width; x++) {
              const i = row + x * 4;
              const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
              const notBg = Math.abs(r - bg.r) > threshold || Math.abs(g - bg.g) > threshold || Math.abs(b - bg.b) > threshold || a < 255;
              if (notBg) { if (x < minX) minX = x; if (y < minY) minY = y; if (x > maxX) maxX = x; if (y > maxY) maxY = y; }
            }
          }
          if (maxX < minX || maxY < minY) return;
          const contentW = maxX - minX + 1;
          const contentH = maxY - minY + 1;
          // Aim to put content bbox centered in viewport. We only pan (no zoom yet).
          const vw = canvas.clientWidth, vh = canvas.clientHeight;
          // Fit content with padding
          const fit = Math.min(vw / Math.max(1, contentW + 40), vh / Math.max(1, contentH + 40));
          zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, Math.min(1, fit)));
          const srcW = Math.max(1, Math.round(vw / zoom));
          const srcH = Math.max(1, Math.round(vh / zoom));
          const targetX = Math.max(0, minX - Math.max(0, (srcW - contentW) / 2));
          const targetY = Math.max(0, minY - Math.max(0, (srcH - contentH) / 2));
          viewX = Math.min(targetX, Math.max(0, worldCanvas.width - srcW));
          viewY = Math.min(targetY, Math.max(0, worldCanvas.height - srcH));
          render();
        } catch (e) {}
      });
    </script>
  </body>
  </html>
